# GitHub 热点周报系统配置文件
# 使用方法：复制为 config.yaml 并填入你的密钥
#   cp config.example.yaml config.yaml
# CI 环境下密钥通过 GitHub Secrets 注入，无需本地配置

# DeepSeek API 配置
deepseek:
  api_key: "YOUR_DEEPSEEK_API_KEY"
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"

# GitHub Token（可选，不填会有速率限制，建议填上）
github_token: ""  # 在 https://github.com/settings/tokens 创建

# 数据源配置
sources:
  # GitHub Trending
  trending:
    enabled: true
    languages: ["", "python", "javascript", "typescript", "go", "rust", "java"]  # 空字符串表示 overall
    since: "weekly"  # daily / weekly / monthly
    max_per_language: 5

  # Star 增长追踪
  star_growth:
    enabled: true
    max_results: 15
    # 搜索过去几天内创建的高 star 项目
    days_range: 7

  # HackerNews
  hackernews:
    enabled: true
    max_results: 15
    min_points: 50  # 最低分数过滤
    days_range: 7

  # Reddit
  reddit:
    enabled: true
    max_results: 15
    subreddits: ["programming", "MachineLearning", "webdev", "python", "javascript", "rust"]
    min_score: 50
    days_range: 7

  # GitHub Releases
  releases:
    enabled: true
    # 追踪的热门组织/项目
    repos:
      - "facebook/react"
      - "vuejs/vue"
      - "angular/angular"
      - "microsoft/typescript"
      - "golang/go"
      - "rust-lang/rust"
      - "python/cpython"
      - "openai/openai-python"
      - "langchain-ai/langchain"
      - "vercel/next.js"
      - "denoland/deno"
      - "tailwindlabs/tailwindcss"
      - "pytorch/pytorch"
      - "tensorflow/tensorflow"
      - "fastapi/fastapi"
      - "spring-projects/spring-boot"
    days_range: 7

# 输出配置
output:
  dir: "output"
  filename_template: "weekly_{date}.html"

# 摘要生成配置
summary:
  language: "中文"
  max_projects: 50  # 最终展示的最大项目数
  # 摘要 prompt 模板
  prompt_template: |
    请用中文为以下 GitHub 项目撰写技术摘要。
    严格按以下格式输出，每个小标题单独一行，每段内容简短（1-2句话），不要用markdown:

    【定位】一两句话说清楚这是什么，解决什么问题
    【亮点】2-3个关键技术特性或创新点，用顿号分隔
    【场景】适合谁用、用在什么场景
    【热度】为什么近期受关注

    项目名称：{name}
    项目地址：{url}
    编程语言：{language}
    Star 数：{stars}
    原始描述：{description}
    README 内容：{readme}
